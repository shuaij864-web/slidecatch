name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - run: npm run package
      - name: Verify extension archive
        shell: bash
        run: |
          ARCHIVE="release/slidecatch-v$(node -p "require('./package.json').version").zip"
          unzip -t "$ARCHIVE"
          npm run verify:release
      - name: Build/browser-surface smoke harness
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: slidecatch-static-validation
          path: |
            release/slidecatch-v*.zip
            docs/assets/cloud-validation-result.json
            docs/assets/cloud-validation-environment.json
            docs/assets/cloud-validation-*.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  extension-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production extension build smoke test
        run: npm run test:extension
