name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:release
      - name: Install Playwright Chromium
        run: |
          python -m pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: Browser bundle harness
        run: npm run test:e2e
        env:
          CHROMIUM_PATH: ''
      - name: Full unpacked-extension E2E
        run: npm run test:extension
        env:
          CHROMIUM_PATH: ''
          SLIDECATCH_E2E_HEADLESS: '1'
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build source archive, Git bundle, and checksums
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          git archive --format=zip --prefix="slidecatch-${RELEASE_TAG}/" \
            -o "release/slidecatch-${RELEASE_TAG}-source.zip" "$RELEASE_TAG"
          git bundle create "release/slidecatch-${RELEASE_TAG}.git.bundle" --all
          git bundle verify "release/slidecatch-${RELEASE_TAG}.git.bundle"
          cp VALIDATION_REPORT.md release/validation-report.md
          cd release
          sha256sum slidecatch-v*.zip slidecatch-v*.git.bundle validation-report.md > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/slidecatch-v*.zip release/slidecatch-v*.git.bundle \
              release/validation-report.md release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release/slidecatch-v*.zip release/slidecatch-v*.git.bundle \
              release/validation-report.md release/SHA256SUMS.txt \
              --verify-tag --generate-notes --title "SlideCatch $RELEASE_TAG"
          fi
