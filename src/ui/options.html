<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlideCatch Settings</title><link rel="stylesheet" href="options.css"></head><body><main class="settings-shell"><header><div class="brand"><img src="icons/icon48.png" alt=""><div><h1>SlideCatch</h1><p data-i18n="settings">Settings</p></div></div><a href="library.html" class="library-link" data-i18n="openLibrary">Open library / export</a></header><section class="panel"><h2 data-i18n="detection">Detection</h2><div class="form-grid"><label><span data-i18n="detectionMode">Detection mode</span><select id="detectionMode"><option value="strict">Strict</option><option value="balanced">Balanced</option><option value="permissive">Permissive</option></select></label><label><span data-i18n="minWidth">Minimum width</span><input id="minWidth" type="number"></label><label><span data-i18n="minHeight">Minimum height</span><input id="minHeight" type="number"></label><label><span data-i18n="pollInterval">Scan interval (ms)</span><input id="pollIntervalMs" type="number"></label><label><span data-i18n="maxImageMb">Maximum image size (MB)</span><input id="maxImageMb" type="number"></label></div><div class="checks"><label><input id="scanBackgroundImages" type="checkbox"> <span data-i18n="scanBackgrounds">Scan CSS background images</span></label><label><input id="captureCanvas" type="checkbox"> <span data-i18n="captureCanvas">Capture large canvas snapshots</span></label><label><input id="visibleOnly" type="checkbox"> <span data-i18n="visibleOnly">Only capture visible elements</span></label><label><input id="showOverlay" type="checkbox"> <span data-i18n="showOverlay">Show collection overlay</span></label></div></section><section class="panel"><h2 data-i18n="customProviders">Custom provider rules</h2><textarea id="customProviders" rows="12" spellcheck="false"></textarea><div id="jsonError" class="error hidden"></div></section><section class="panel"><h2 data-i18n="enabledSites">Enabled sites</h2><div id="sitesList"></div><div id="sitesEmpty" class="empty hidden" data-i18n="noEnabledSites">No sites enabled.</div></section><section class="panel"><h2 data-i18n="privacy">Privacy</h2><p data-i18n="privacyStatement">Slides and metadata stay in this browser profile.</p><p data-i18n="boundaryStatement">It does not bypass login or access controls.</p></section><footer><span id="saveStatus"></span><button id="resetBtn" class="secondary" data-i18n="resetDefaults">Reset defaults</button><button id="saveBtn" class="primary" data-i18n="save">Save</button></footer></main><script type="module" src="options.js"></script></body></html>
