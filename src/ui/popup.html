<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlideCatch</title><link rel="stylesheet" href="popup.css"></head><body><main class="popup-shell"><header class="brand-row"><img src="icons/icon48.png" alt="" class="brand-icon"><div><h1>SlideCatch</h1><p data-i18n="tagline">Local-first web slide collector</p></div><span id="statePill" class="pill neutral" data-testid="site-state">Checking</span></header><section class="card site-card"><div class="label" data-i18n="currentSite">Current site</div><div id="siteName" class="site-name">—</div><div id="providerName" class="subtle">—</div><div id="unsupportedNotice" class="notice hidden" data-i18n="unsupportedPage">This page cannot run extensions.</div><div class="actions two"><button id="enableBtn" class="primary" data-testid="enable-site" data-i18n="enableSite">Enable on this site</button><button id="disableBtn" class="secondary hidden" data-testid="disable-site" data-i18n="disableSite">Disable</button></div></section><section id="sessionCard" class="card hidden"><div class="session-head"><div><div class="label" data-i18n="currentSession">Current session</div><div id="sessionTitle" class="session-title">—</div></div><span id="collectingPill" class="pill good">Collecting</span></div><div class="metrics"><div><strong id="slideCount" data-testid="slide-count">0</strong><span data-i18n="slides">Slides</span></div><div><strong id="pageCount">0</strong><span data-i18n="pageNumbers">Page nos.</span></div><div><strong id="missingCount">0</strong><span data-i18n="missing">Missing</span></div></div><div id="pendingBox" class="notice warning hidden"><span id="pendingText"></span><button id="grantBtn" class="link-button" data-testid="grant-hosts" data-i18n="grantResourceHosts">Grant resource hosts</button></div><div id="errorBox" class="notice error hidden"></div><div class="actions two"><button id="scanBtn" class="primary" data-testid="scan" data-i18n="scanNow">Scan now</button><button id="pauseBtn" class="secondary" data-testid="pause" data-i18n="pause">Pause</button></div><button id="libraryBtn" class="wide secondary" data-testid="open-library" data-i18n="openLibrary">Open library / export</button></section><footer><button id="historyBtn" class="text-button" data-i18n="history">History</button><button id="optionsBtn" class="text-button" data-i18n="settings">Settings</button><span class="privacy" data-i18n="localOnly">Local only · no telemetry</span></footer></main><script type="module" src="popup.js"></script></body></html>
