<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlideCatch Library</title><link rel="stylesheet" href="library.css"></head><body><header class="topbar no-print"><div class="brand"><img src="icons/icon48.png" alt=""><div><strong>SlideCatch</strong><span data-i18n="library">Library</span></div></div><div class="toolbar"><select id="sortMode"><option value="auto">Auto sort</option><option value="page">Page number</option><option value="capture">Capture order</option></select><button id="renameBtn">Rename</button><button id="downloadBtn" class="primary">Download ZIP</button><button id="printBtn">Print / PDF</button><button id="clearBtn" class="danger">Clear slides</button></div></header><main><section id="historyView"><div class="page-heading"><div><h1>SlideCatch</h1><p data-i18n="historyHelp">Sessions are stored locally in this browser profile.</p></div></div><div id="historyGrid" class="history-grid"></div><div id="historyEmpty" class="empty hidden">No captured sessions yet.</div></section><section id="detailView" class="hidden"><div class="page-heading no-print"><div><button id="backBtn">← Back</button><h1 id="sessionTitle">Slides</h1><p id="sessionMeta"></p></div><div class="summary-badges"><span id="countBadge"></span><span id="pageBadge"></span></div></div><div id="missingBanner" class="missing-banner hidden"></div><div id="slidesGrid" class="slides-grid"></div><div id="slidesEmpty" class="empty hidden">No slides.</div></section></main><script type="module" src="library.js"></script></body></html>
